<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - GameLog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gamelog.css">
</head>
<body>

<nav class="nav">
    <div class="wrap">
        <a class="logo" href="index.html"><i></i>GameLog</a>
        <div class="links">
            <a href="index.html">Jogos</a>
            <a href="perfil.html" aria-current="page">Meu perfil</a>
        </div>
    </div>
</nav>

<div class="banner"><div class="banner-img" id="bannerPerfil"></div></div>

<main class="wrap">
    <section class="cabeca rise">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=gabriel" alt="Avatar" class="avatar" id="fotoPerfil">
        <div>
            <h1 class="nome-usuario" id="nomeUsuario">Carregando...</h1>
            <p class="sub">Diário de jogos</p>
        </div>
    </section>

    <div class="painel">
        <section>
            <div class="filtros" id="filtros"></div>
            <div id="listaReviews"><p>Carregando registros...</p></div>
        </section>

        <aside class="lateral" id="lateral" hidden>
            <div class="stat-grid">
                <div class="stat"><strong id="nJogos">0</strong><span>jogos registrados</span></div>
                <div class="stat"><strong id="nMedia">0</strong><span>nota média</span></div>
            </div>
            <div class="hist">
                <h3>Distribuição das notas</h3>
                <div id="hist"></div>
            </div>
        </aside>
    </div>
</main>

<script src="gamelog.js"></script>
<script>
    // Lê o usuário da URL (ex: perfil.html?user=gabriel_farias)
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user') || 'gabriel_farias';
    let todas = [];

    // Efeito parallax leve no banner
    const bannerImg = document.getElementById('bannerPerfil');
    if (!reduz) addEventListener('scroll', () => {
        if (scrollY < 400) bannerImg.style.transform = `translateY(${scrollY * 0.3}px)`;
    }, {passive: true});

    async function carregarPerfil() {
        try {
            const respUser = await fetch(`/api/usuarios/${encodeURIComponent(username)}`);
            if (!respUser.ok) throw new Error('Usuário não encontrado');
            const user = await respUser.json();

            const nome = document.getElementById('nomeUsuario');
            nome.textContent = '@' + user.username;

            // Monetização visual: borda premium e banner
            if (user.premium) {
                const cor = user.corBordaPerfil || '#0055ff';
                const avatar = document.getElementById('fotoPerfil');
                avatar.style.border = `4px solid ${cor}`;
                avatar.style.boxShadow = `0 0 20px ${cor}aa`;
                nome.insertAdjacentHTML('beforeend', '<span class="selo">Premium</span>');
            }
            if (user.urlBannerPerfil) {
                bannerImg.style.backgroundImage = `url("${user.urlBannerPerfil}")`;
            }
            carregarReviews(user.id);
        } catch (error) {
            document.getElementById('nomeUsuario').textContent = 'Usuário não encontrado';
            document.getElementById('listaReviews').innerHTML = '<p>Confira o nome na URL e tente de novo.</p>';
        }
    }

    function estrelas(nota) {
        const n = Math.max(0, Math.min(5, Math.round(nota)));
        return [1, 2, 3, 4, 5].map(i => `<span class="st${i <= n ? ' on' : ''}" style="--k:${i}">★</span>`).join('');
    }

    const vazio = '<p>Nenhum jogo registrado ainda. <a href="index.html" style="color:var(--accent2)">Busque um jogo</a> para começar.</p>';

    async function carregarReviews(userId) {
        const lista = document.getElementById('listaReviews');
        try {
            const resp = await fetch(`/api/registros/usuario/${userId}`);
            if (resp.status === 204 || !resp.ok) { lista.innerHTML = vazio; return; }
            todas = await resp.json();
            if (!todas.length) { lista.innerHTML = vazio; return; }

            montarEstatisticas();
            montarFiltros();
            renderLista('Todos');
        } catch (error) {
            lista.innerHTML = '<p>Não foi possível carregar os registros. Tente recarregar a página.</p>';
            console.error('Erro ao carregar reviews', error);
        }
    }

    function montarEstatisticas() {
        const notas = todas.map(r => Number(r.nota) || 0);
        document.getElementById('lateral').hidden = false;
        contar(document.getElementById('nJogos'), todas.length);
        contar(document.getElementById('nMedia'), notas.reduce((a, b) => a + b, 0) / notas.length, 1);

        const cont = [0, 0, 0, 0, 0, 0];
        notas.forEach(n => cont[Math.max(0, Math.min(5, Math.round(n)))]++);
        const max = Math.max(...cont.slice(1), 1);
        document.getElementById('hist').innerHTML = [5, 4, 3, 2, 1].map(n => `
            <div class="h-row"><span>${n}★</span><div class="h-bar"><i data-w="${cont[n] / max * 100}"></i></div><span>${cont[n]}</span></div>`).join('');
        // Barras enchem suavemente depois de entrar na página
        requestAnimationFrame(() => setTimeout(() =>
            document.querySelectorAll('.h-bar i').forEach(b => b.style.width = b.dataset.w + '%'), 150));
    }

    function montarFiltros() {
        const status = ['Todos', ...new Set(todas.map(r => r.status).filter(Boolean))];
        const box = document.getElementById('filtros');
        box.innerHTML = status.map((s, i) => `<button class="chip" type="button" aria-pressed="${i === 0}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
        box.querySelectorAll('.chip').forEach(c => c.onclick = () => {
            box.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', o === c));
            renderLista(c.dataset.s);
        });
    }

    function renderLista(filtro) {
        const itens = filtro === 'Todos' ? todas : todas.filter(r => r.status === filtro);
        // Ainda guardamos só o ID do RAWG; depois dá pra buscar nome e capa por ele.
        document.getElementById('listaReviews').innerHTML = itens.map((rev, i) => `
            <article class="review reveal" style="--i:${i % 8}">
                <div class="review-capa">RAWG #${esc(rev.idJogoRawg)}</div>
                <div>
                    <div class="review-topo">
                        <span class="review-jogo">Jogo ID (RAWG): ${esc(rev.idJogoRawg)}</span>
                        <span class="estrelas" aria-label="Nota ${esc(rev.nota)} de 5">${estrelas(rev.nota)}<small>${esc(rev.nota)} / 5</small></span>
                    </div>
                    <span class="status">${esc(rev.status)}</span>
                    <p class="review-texto">${esc(rev.review)}</p>
                </div>
            </article>`).join('');
        observar();
    }

    carregarPerfil();
</script>

</body>
</html>
